<svg width="480" height="720" viewBox="0 0 480 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- THEME 04: VINTAGE 80s ARCADE CABINET MACHINE -->
  <defs>
    <!-- Cabinet Gradients -->
    <linearGradient id="marqueeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cabinetSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="25%" stop-color="#a21caf" />
      <stop offset="80%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <linearGradient id="arcadeControlDeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="arcadeScreenCRT" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="80%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="arcadeShadow" x="-5%" y="-3%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="Theme_Arcade_Cabinet" filter="url(#arcadeShadow)">
    <!-- 1. Outer Cabinet Silhouette (Side Panels & Hood) -->
    <!-- Outer Red T-Molding Border -->
    <path d="M 30 10 L 450 10 L 465 140 L 455 450 L 470 700 L 10 700 L 25 450 L 15 140 Z" fill="#b91c1c"/>
    <!-- Main Cabinet Purple Chassis -->
    <path d="M 34 14 L 446 14 L 460 140 L 450 450 L 464 696 L 16 696 L 30 450 L 20 140 Z" fill="url(#cabinetSideGrad)"/>

    <!-- Left & Right Cabinet Wing Shading -->
    <polygon points="16,696 20,140 34,14 44,14 36,450 30,696" fill="#000000" opacity="0.35"/>
    <polygon points="464,696 460,140 446,14 436,14 444,450 450,696" fill="#000000" opacity="0.45"/>

    <!-- ================= 2. TOP BACKLIT MARQUEE ================= -->
    <g id="Arcade_Marquee" transform="translate(38, 20)">
      <!-- Marquee Outer Frame -->
      <rect x="0" y="0" width="404" height="110" rx="4" fill="#09090b" stroke="#f43f5e" stroke-width="3"/>
      
      <!-- Backlit Glass Background (Cosmic Nebula & Stars) -->
      <rect x="4" y="4" width="396" height="102" fill="url(#marqueeGlow)"/>
      
      <!-- Cosmic Stars & Planet Graphics -->
      <g opacity="0.8">
        <circle cx="40" cy="30" r="1.5" fill="#ffffff"/>
        <circle cx="85" cy="80" r="2" fill="#f43f5e"/>
        <circle cx="350" cy="25" r="1.5" fill="#facc15"/>
        <circle cx="320" cy="85" r="2" fill="#38bdf8"/>
        <!-- Ringed Planet in Marquee -->
        <circle cx="360" cy="65" r="14" fill="#ec4899"/>
        <ellipse cx="360" cy="65" rx="22" ry="5" fill="none" stroke="#facc15" stroke-width="2" transform="rotate(-20 360 65)"/>
      </g>

      <!-- Center Glowing Sunburst behind Title -->
      <circle cx="202" cy="55" r="32" fill="#ea580c" opacity="0.4"/>
      <circle cx="202" cy="55" r="20" fill="#facc15" opacity="0.5"/>

      <!-- Marquee Title 3D Typography: "POSTURE DEFENDER" -->
      <!-- Shadow Layer -->
      <text x="204" y="65" text-anchor="middle" fill="#7f1d1d" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="3">POSTURE DEFENDER</text>
      <!-- Middle Red Layer -->
      <text x="202" y="63" text-anchor="middle" fill="#dc2626" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="3">POSTURE DEFENDER</text>
      <!-- Foreground Glowing Yellow Layer -->
      <text x="200" y="61" text-anchor="middle" fill="#fde047" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="3">POSTURE DEFENDER</text>

      <!-- Marquee Subtitle -->
      <text x="200" y="92" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="4">★ 1984 COIN-OP EDITION ★</text>
    </g>

    <!-- Top Cabinet Hood Shadow -->
    <rect x="38" y="132" width="404" height="12" fill="#000000" opacity="0.6"/>

    <!-- ================= 3. CRT MONITOR BEZEL & WEBCAM CUTOUT ================= -->
    <g id="CRT_Monitor_Area" transform="translate(42, 148)">
      <!-- Monitor Bezel Surround -->
      <rect x="0" y="0" width="396" height="320" rx="30" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
      
      <!-- Inner Cathode Tube Bevel -->
      <rect x="8" y="8" width="380" height="304" rx="26" fill="#020617"/>

      <!-- Live Webcam Cutout Area (Curved CRT Screen) -->
      <rect id="Webcam_Cutout" x="16" y="16" width="364" height="288" rx="24" fill="url(#arcadeScreenCRT)"/>

      <!-- CRT Curved Screen Reflection -->
      <path d="M 28 28 Q 120 22 260 40 Q 140 50 28 110 Z" fill="#ffffff" opacity="0.12"/>

      <!-- Arcade Retro HUD Overlay -->
      <g id="Arcade_HUD">
        <!-- 1UP & HIGH SCORE -->
        <text x="32" y="44" fill="#ef4444" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="1">1UP</text>
        <text x="32" y="60" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="bold">024500</text>

        <text x="200" y="44" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="1">HIGH SCORE</text>
        <text x="200" y="60" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="bold">999900</text>

        <!-- Posture Status Badge -->
        <rect x="32" y="270" width="130" height="22" rx="4" fill="#000000" opacity="0.8" stroke="#22c55e" stroke-width="1.5"/>
        <text x="97" y="285" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">STAGE 1: TEGAK</text>
      </g>
    </g>

    <!-- ================= 4. ARCADE CONTROL DECK (JOYSTICK & BUTTONS) ================= -->
    <g id="Control_Deck" transform="translate(32, 480)">
      <!-- Angled Deck Base -->
      <polygon points="0,30 416,30 406,140 10,140" fill="url(#arcadeControlDeck)" stroke="#09090b" stroke-width="2"/>
      
      <!-- 80s Synthwave Grid Lines on Deck Surface -->
      <g opacity="0.35">
        <line x1="20" y1="45" x2="396" y2="45" stroke="#38bdf8" stroke-width="1"/>
        <line x1="16" y1="70" x2="400" y2="70" stroke="#f43f5e" stroke-width="1"/>
        <line x1="13" y1="100" x2="403" y2="100" stroke="#facc15" stroke-width="1.5"/>
        <line x1="100" y1="30" x2="80" y2="140" stroke="#38bdf8" stroke-width="1"/>
        <line x1="208" y1="30" x2="208" y2="140" stroke="#f43f5e" stroke-width="1"/>
        <line x1="316" y1="30" x2="336" y2="140" stroke="#38bdf8" stroke-width="1"/>
      </g>

      <!-- Joystick 1 (Red Ball Top with Chrome Shaft) -->
      <g id="Arcade_Joystick" transform="translate(90, 80)">
        <!-- Dust Washer Base -->
        <ellipse cx="0" cy="18" rx="22" ry="7" fill="#09090b" stroke="#334155" stroke-width="1.5"/>
        <!-- Chrome Shaft -->
        <line x1="0" y1="18" x2="0" y2="-10" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
        <line x1="-1" y1="18" x2="-1" y2="-10" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Red Balltop with 3D Specular Highlight -->
        <circle cx="0" cy="-14" r="16" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
        <circle cx="-5" cy="-19" r="4" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- Center Button: "HYPERSPACE" (White Dome Button) -->
      <g id="Button_Hyperspace" transform="translate(208, 90)">
        <ellipse cx="0" cy="6" rx="18" ry="8" fill="#09090b"/>
        <ellipse cx="0" cy="0" rx="14" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="0" y="24" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">HYPERSPACE</text>
      </g>

      <!-- Action Push Buttons (Red, Blue, Yellow Convex Buttons) -->
      <g id="Action_Buttons" transform="translate(300, 75)">
        <!-- Button 1: FIRE (Red) -->
        <g transform="translate(0, 10)">
          <ellipse cx="0" cy="4" rx="16" ry="8" fill="#000000"/>
          <ellipse cx="0" cy="0" rx="13" ry="7" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
          <circle cx="-3" cy="-2" r="2.5" fill="#ffffff" opacity="0.6"/>
          <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">FIRE</text>
        </g>

        <!-- Button 2: JUMP (Blue) -->
        <g transform="translate(42, -2)">
          <ellipse cx="0" cy="4" rx="16" ry="8" fill="#000000"/>
          <ellipse cx="0" cy="0" rx="13" ry="7" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
          <circle cx="-3" cy="-2" r="2.5" fill="#ffffff" opacity="0.6"/>
          <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">JUMP</text>
        </g>

        <!-- Button 3: CALIBRATE (Yellow) -->
        <g transform="translate(84, 10)">
          <ellipse cx="0" cy="4" rx="16" ry="8" fill="#000000"/>
          <ellipse cx="0" cy="0" rx="13" ry="7" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
          <circle cx="-3" cy="-2" r="2.5" fill="#ffffff" opacity="0.6"/>
          <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">RESET</text>
        </g>
      </g>
    </g>

    <!-- ================= 5. COIN DOOR (BOTTOM) ================= -->
    <g id="Coin_Door" transform="translate(150, 630)">
      <!-- Metallic Coin Door Frame -->
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
      
      <!-- Coin Slot 1 (25 Cents) -->
      <g transform="translate(30, 10)">
        <rect x="0" y="0" width="45" height="38" rx="4" fill="#09090b" stroke="#71717a" stroke-width="1.5"/>
        <rect x="18" y="6" width="9" height="18" rx="2" fill="#e11d48"/>
        <line x1="22.5" y1="9" x2="22.5" y2="21" stroke="#ffffff" stroke-width="1.5"/>
        <text x="22.5" y="32" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="7" font-weight="bold">25¢</text>
      </g>

      <!-- Coin Slot 2 (25 Cents) -->
      <g transform="translate(105, 10)">
        <rect x="0" y="0" width="45" height="38" rx="4" fill="#09090b" stroke="#71717a" stroke-width="1.5"/>
        <rect x="18" y="6" width="9" height="18" rx="2" fill="#e11d48"/>
        <line x1="22.5" y1="9" x2="22.5" y2="21" stroke="#ffffff" stroke-width="1.5"/>
        <text x="22.5" y="32" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="7" font-weight="bold">25¢</text>
      </g>

      <!-- Insert Coin Pulsing Text -->
      <text x="90" y="55" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="2">INSERT COIN TO PLAY</text>
    </g>
  </g>
</svg>
