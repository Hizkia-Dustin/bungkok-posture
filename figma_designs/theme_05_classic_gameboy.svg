<svg width="440" height="700" viewBox="0 0 440 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- THEME 05: CLASSIC 90s RETRO HANDHELD CONSOLE (GAME BOY STYLE) -->
  <defs>
    <!-- Chassis Gradients -->
    <linearGradient id="gbBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gbBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="gbScreenLCD" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8ba870" />
      <stop offset="70%" stop-color="#708c56" />
      <stop offset="100%" stop-color="#556b2f" />
    </radialGradient>
    <filter id="gbShadow" x="-5%" y="-3%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="Theme_Classic_GameBoy" filter="url(#gbShadow)">
    <!-- 1. Outer Chassis (Iconic Game Boy Shape with Slanted Bottom Right Corner) -->
    <path d="M 30 15 
             L 410 15 
             A 20 20 0 0 1 430 35 
             L 430 630 
             Q 430 660 380 685 
             L 340 685 
             L 30 685 
             A 20 20 0 0 1 10 665 
             L 10 35 
             A 20 20 0 0 1 30 15 Z" 
          fill="url(#gbBodyGrad)" stroke="#94a3b8" stroke-width="3"/>

    <!-- Subtle Inset Bevel Grooves on Top Edge -->
    <line x1="20" y1="28" x2="420" y2="28" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="36" x2="420" y2="36" stroke="#cbd5e1" stroke-width="2"/>

    <!-- ================= 2. SCREEN BEZEL ================= -->
    <g id="Screen_Surround" transform="translate(30, 60)">
      <!-- Dark Grey Bezel Base -->
      <rect x="0" y="0" width="380" height="290" rx="16" fill="url(#gbBezelGrad)" stroke="#334155" stroke-width="2"/>
      
      <!-- Bottom-Right Cutout Angle on Bezel -->
      <polygon points="380,260 350,290 380,290" fill="url(#gbBodyGrad)"/>
      <line x1="380" y1="260" x2="350" y2="290" stroke="#334155" stroke-width="2"/>

      <!-- Accent Striping (Magenta & Navy Blue Lines) -->
      <line x1="24" y1="22" x2="356" y2="22" stroke="#991b1b" stroke-width="3"/>
      <line x1="24" y1="27" x2="356" y2="27" stroke="#1e3a8a" stroke-width="2"/>

      <!-- "DOT MATRIX WITH STEREO SOUND" Text -->
      <text x="50" y="16" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">DOT MATRIX WITH STEREO SOUND</text>

      <!-- Battery Indicator LED (Red) -->
      <g id="Battery_LED" transform="translate(32, 120)">
        <circle cx="0" cy="0" r="4.5" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
        <text x="0" y="18" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="7" font-weight="bold">BATTERY</text>
      </g>

      <!-- ================= 3. LCD SCREEN CUTOUT (WEBCAM LIVE FEED) ================= -->
      <!-- Green/Yellow Retro LCD Background or Live Camera Window -->
      <rect id="Webcam_Cutout" x="58" y="44" width="280" height="216" rx="8" fill="url(#gbScreenLCD)" stroke="#1e293b" stroke-width="3"/>

      <!-- Pixel Grid & Scanline Pattern -->
      <g opacity="0.12">
        <line x1="58" y1="80" x2="338" y2="80" stroke="#000000" stroke-width="1"/>
        <line x1="58" y1="120" x2="338" y2="120" stroke="#000000" stroke-width="1"/>
        <line x1="58" y1="160" x2="338" y2="160" stroke="#000000" stroke-width="1"/>
        <line x1="58" y1="200" x2="338" y2="200" stroke="#000000" stroke-width="1"/>
        <line x1="58" y1="240" x2="338" y2="240" stroke="#000000" stroke-width="1"/>
      </g>

      <!-- 8-Bit LCD HUD Text -->
      <g id="LCD_HUD" transform="translate(70, 68)">
        <text x="0" y="0" fill="#1b330e" font-family="monospace" font-size="12" font-weight="bold">POSTURE: 95%</text>
        <text x="0" y="176" fill="#1b330e" font-family="monospace" font-size="10" font-weight="bold">STAGE 01 · 00:15:20</text>
      </g>
    </g>

    <!-- Console Branding Text -->
    <text x="45" y="380" fill="#1e3a8a" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" font-style="italic" letter-spacing="1">BUNGKOK <tspan fill="#64748b" font-style="normal" font-weight="bold" font-size="12">BOY™</tspan></text>

    <!-- ================= 4. D-PAD & CONTROLS ================= -->
    <!-- 8-Way Cross Directional Pad (Black Plastic with Center Indent) -->
    <g id="DPad" transform="translate(85, 475)">
      <!-- Drop Shadow -->
      <rect x="-14" y="-40" width="28" height="80" rx="3" fill="#0f172a"/>
      <rect x="-40" y="-14" width="80" height="28" rx="3" fill="#0f172a"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b"/>
      
      <!-- Direction Triangles -->
      <polygon points="0,-34 -6,-24 6,-24" fill="#64748b"/>
      <polygon points="0,34 -6,24 6,24" fill="#64748b"/>
      <polygon points="-34,0 -24,-6 -24,6" fill="#64748b"/>
      <polygon points="34,0 24,-6 24,6" fill="#64748b"/>
    </g>

    <!-- Angled Action Buttons (A and B - Burgundy / Magenta Plastic) -->
    <g id="Action_Buttons" transform="translate(290, 470) rotate(-25)">
      <!-- Recessed Oval Enclosure -->
      <rect x="-10" y="-18" width="130" height="48" rx="24" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Button B (Left) -->
      <g transform="translate(20, 6)">
        <circle cx="0" cy="0" r="19" fill="#881337" stroke="#4c0519" stroke-width="2"/>
        <circle cx="-4" cy="-5" r="5" fill="#f43f5e" opacity="0.6"/>
        <text x="0" y="32" text-anchor="middle" fill="#1e3a8a" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold">B</text>
      </g>

      <!-- Button A (Right) -->
      <g transform="translate(80, 6)">
        <circle cx="0" cy="0" r="19" fill="#881337" stroke="#4c0519" stroke-width="2"/>
        <circle cx="-4" cy="-5" r="5" fill="#f43f5e" opacity="0.6"/>
        <text x="0" y="32" text-anchor="middle" fill="#1e3a8a" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold">A</text>
      </g>
    </g>

    <!-- ================= 5. SELECT & START BUTTONS ================= -->
    <g id="Select_Start_Buttons" transform="translate(175, 595)">
      <!-- SELECT Pill Button -->
      <g transform="translate(0, 0) rotate(-25)">
        <rect x="-18" y="-6" width="36" height="12" rx="6" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
        <text x="0" y="24" text-anchor="middle" fill="#1e3a8a" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" letter-spacing="1">SELECT</text>
      </g>

      <!-- START Pill Button -->
      <g transform="translate(65, 0) rotate(-25)">
        <rect x="-18" y="-6" width="36" height="12" rx="6" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
        <text x="0" y="24" text-anchor="middle" fill="#1e3a8a" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" letter-spacing="1">START</text>
      </g>
    </g>

    <!-- ================= 6. SPEAKER GRILLE SLOTS (BOTTOM RIGHT) ================= -->
    <g id="Speaker_Grille" transform="translate(340, 610) rotate(-25)" stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="45" y2="0"/>
      <line x1="0" y1="10" x2="45" y2="10"/>
      <line x1="0" y1="20" x2="45" y2="20"/>
      <line x1="0" y1="30" x2="45" y2="30"/>
      <line x1="0" y1="40" x2="45" y2="40"/>
      <line x1="0" y1="50" x2="45" y2="50"/>
    </g>

    <!-- Headphone Jack Icon / Label at Bottom -->
    <text x="220" y="675" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold">🎧 PHONES</text>
  </g>
</svg>
