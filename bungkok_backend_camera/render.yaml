services:
  - type: web
    name: bungkok-backend-camera
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
