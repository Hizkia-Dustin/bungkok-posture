<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- THEME 03: RETRO 90s CRT TELEVISION WITH PIXEL STICKERS -->
  <defs>
    <radialGradient id="crtGlassGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="tvChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="tvBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="tvShadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g id="Theme_Retro_CRT_TV" filter="url(#tvShadow)">
    <!-- 1. Outer TV Chassis (Rounded Vintage Silver Plastic) -->
    <rect id="TV_Body" x="15" y="15" width="470" height="470" rx="36" fill="url(#tvChassisGrad)" stroke="#475569" stroke-width="3"/>
    
    <!-- Top Highlight Bevel -->
    <path d="M 35 18 Q 250 14 465 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" fill="none"/>

    <!-- 2. Dark Inner Bezel (Curved Cathode Tube Frame) -->
    <rect id="CRT_Bezel" x="32" y="32" width="436" height="346" rx="28" fill="url(#tvBezelGrad)" stroke="#090d16" stroke-width="4"/>
    <rect x="36" y="36" width="428" height="338" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7"/>

    <!-- 3. CRT Screen Cutout (Webcam live feed area) -->
    <rect id="Webcam_Cutout" x="42" y="42" width="416" height="326" rx="20" fill="url(#crtGlassGlow)"/>

    <!-- Subtle CRT Curved Reflection / Glare Arc -->
    <path d="M 52 56 Q 160 50 360 76 Q 180 82 52 140 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Scanline Texture Grid (Retro overlay) -->
    <g id="Scanlines" opacity="0.15">
      <line x1="42" y1="80" x2="458" y2="80" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="120" x2="458" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="160" x2="458" y2="160" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="200" x2="458" y2="200" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="240" x2="458" y2="240" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="280" x2="458" y2="280" stroke="#ffffff" stroke-width="1"/>
      <line x1="42" y1="320" x2="458" y2="320" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- CRT HUD Indicator inside Screen -->
    <g id="CRT_OSD" transform="translate(60, 64)">
      <text x="0" y="0" fill="#22c55e" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="1">AV-1 · POSTURE: TEGAK</text>
      <text x="0" y="280" fill="#22c55e" font-family="'Courier New', monospace" font-size="12" opacity="0.8">CH 03 · 60Hz NTSC</text>
    </g>

    <!-- ================= 4. BOTTOM CONTROL PANEL & SPEAKERS ================= -->
    <g id="Bottom_Panel" transform="translate(20, 388)">
      <!-- Panel Divider Groove -->
      <line x1="10" y1="4" x2="450" y2="4" stroke="#475569" stroke-width="2"/>
      <line x1="10" y1="6" x2="450" y2="6" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

      <!-- Left Speaker Grille (Dot matrix mesh) -->
      <g id="Left_Speaker" fill="#334155" opacity="0.6">
        <circle cx="24" cy="40" r="1.5"/><circle cx="32" cy="40" r="1.5"/><circle cx="40" cy="40" r="1.5"/><circle cx="48" cy="40" r="1.5"/><circle cx="56" cy="40" r="1.5"/>
        <circle cx="20" cy="48" r="1.5"/><circle cx="28" cy="48" r="1.5"/><circle cx="36" cy="48" r="1.5"/><circle cx="44" cy="48" r="1.5"/><circle cx="52" cy="48" r="1.5"/><circle cx="60" cy="48" r="1.5"/>
        <circle cx="24" cy="56" r="1.5"/><circle cx="32" cy="56" r="1.5"/><circle cx="40" cy="56" r="1.5"/><circle cx="48" cy="56" r="1.5"/><circle cx="56" cy="56" r="1.5"/>
        <circle cx="20" cy="64" r="1.5"/><circle cx="28" cy="64" r="1.5"/><circle cx="36" cy="64" r="1.5"/><circle cx="44" cy="64" r="1.5"/><circle cx="52" cy="64" r="1.5"/><circle cx="60" cy="64" r="1.5"/>
        <circle cx="24" cy="72" r="1.5"/><circle cx="32" cy="72" r="1.5"/><circle cx="40" cy="72" r="1.5"/><circle cx="48" cy="72" r="1.5"/><circle cx="56" cy="72" r="1.5"/>
      </g>

      <!-- Center Logo: "BUNGKOK TV" Embossed Metallic -->
      <text x="230" y="28" text-anchor="middle" fill="#475569" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="3">BUNGKOK TV</text>

      <!-- Control Dials & Buttons -->
      <!-- Rotary Volume Knob -->
      <g id="Dial_Volume" transform="translate(42, 60)">
        <circle cx="0" cy="0" r="15" fill="#475569" stroke="#1e293b" stroke-width="2"/>
        <circle cx="0" cy="0" r="12" fill="#94a3b8"/>
        <line x1="0" y1="0" x2="0" y2="-9" stroke="#1e293b" stroke-width="2"/>
      </g>

      <!-- Channel Buttons -->
      <g id="Channel_Buttons" transform="translate(170, 58)">
        <circle cx="0" cy="0" r="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="18" cy="0" r="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
        <rect x="34" y="-5" width="22" height="10" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
        <rect x="62" y="-5" width="22" height="10" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
        <rect x="90" y="-5" width="22" height="10" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      </g>

      <!-- RCA AV Jacks (Yellow, White, Red) -->
      <g id="AV_Jacks" transform="translate(300, 58)">
        <rect x="-6" y="-9" width="60" height="18" rx="4" fill="#1e293b"/>
        <!-- Video (Yellow) -->
        <circle cx="6" cy="0" r="5" fill="#eab308" stroke="#000000" stroke-width="1.5"/>
        <circle cx="6" cy="0" r="2" fill="#000000"/>
        <!-- Audio L (White) -->
        <circle cx="24" cy="0" r="5" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
        <circle cx="24" cy="0" r="2" fill="#000000"/>
        <!-- Audio R (Red) -->
        <circle cx="42" cy="0" r="5" fill="#ef4444" stroke="#000000" stroke-width="1.5"/>
        <circle cx="42" cy="0" r="2" fill="#000000"/>
      </g>

      <!-- Power LED & Button -->
      <g id="Power_Switch" transform="translate(420, 58)">
        <circle cx="0" cy="0" r="4" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
        <rect x="12" y="-7" width="14" height="14" rx="2" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
      </g>
    </g>

    <!-- ================= 5. RETRO PIXEL STICKERS ================= -->
    <!-- Sticker 1: Red Tilted "SALE" Banner (Top Right) -->
    <g id="Sticker_Sale_Top" transform="translate(350, 6) rotate(6)">
      <rect x="0" y="0" width="100" height="34" rx="4" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
      <text x="50" y="24" text-anchor="middle" fill="#ffffff" font-family="'Impact', Arial Black, sans-serif" font-size="22" font-weight="bold" letter-spacing="2">SALE!</text>
    </g>

    <!-- Sticker 2: Yellow 8-Bit Pixel Star (Top Left-Center) -->
    <g id="Sticker_Pixel_Star" transform="translate(130, 2)">
      <polygon points="18,0 24,12 36,12 26,20 30,32 18,24 6,32 10,20 0,12 12,12" fill="#facc15" stroke="#000000" stroke-width="2"/>
      <polygon points="18,5 22,14 31,14 24,19 26,27 18,22 10,27 12,19 5,14 14,14" fill="#fef08a"/>
    </g>

    <!-- Sticker 3: Pixel Axe / Hammer (Left Edge) -->
    <g id="Sticker_Pixel_Axe" transform="translate(4, 300) rotate(-15)">
      <rect x="0" y="0" width="8" height="42" fill="#8b5a2b" stroke="#000000" stroke-width="1.5"/>
      <polygon points="-8,4 16,4 12,18 -4,18" fill="#94a3b8" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Sticker 4: "GAME OVER" Tilted Badge with Pixel Controller (Bottom Left) -->
    <g id="Sticker_Game_Over" transform="translate(56, 370) rotate(-8)">
      <rect x="0" y="0" width="124" height="52" rx="6" fill="#000000" stroke="#ffffff" stroke-width="3"/>
      <text x="62" y="26" text-anchor="middle" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" letter-spacing="1">GAME</text>
      <text x="62" y="46" text-anchor="middle" fill="#ef4444" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" letter-spacing="1">OVER</text>
      <!-- Mini Pixel Controller -->
      <g transform="translate(100, 28) scale(0.8)">
        <rect x="0" y="0" width="22" height="14" rx="3" fill="#e2e8f0" stroke="#000000" stroke-width="1"/>
        <line x1="3" y1="7" x2="9" y2="7" stroke="#000000" stroke-width="2"/>
        <circle cx="16" cy="5" r="1.5" fill="#ef4444"/>
        <circle cx="19" cy="8" r="1.5" fill="#ef4444"/>
      </g>
    </g>

    <!-- Sticker 5: Pacman Pixel Coin (Bottom Center) -->
    <g id="Sticker_Pixel_Coin" transform="translate(285, 385)">
      <circle cx="18" cy="18" r="18" fill="#facc15" stroke="#000000" stroke-width="2"/>
      <path d="M 18 18 L 36 8 A 18 18 0 0 0 36 28 Z" fill="#000000"/>
      <circle cx="16" cy="10" r="2.5" fill="#000000"/>
    </g>

    <!-- Sticker 6: Diamond Price Tag "SALE 46% OFF" (Bottom Right) -->
    <g id="Sticker_Sale_46" transform="translate(365, 365) rotate(10)">
      <rect x="0" y="0" width="76" height="56" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
      <rect x="2" y="2" width="72" height="16" fill="#ea580c"/>
      <text x="38" y="14" text-anchor="middle" fill="#ffffff" font-family="'Impact', sans-serif" font-size="12" letter-spacing="1">SALE</text>
      <text x="38" y="44" text-anchor="middle" fill="#ea580c" font-family="'Impact', sans-serif" font-size="24" font-weight="900">46%</text>
      <text x="38" y="52" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="8" font-weight="bold">OFF</text>
    </g>
  </g>
</svg>
