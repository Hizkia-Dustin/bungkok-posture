<svg width="290" height="190" viewBox="0 0 290 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pip-shadow" x="0" y="0" width="290" height="190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- PiP Container (Dark Slate) -->
  <g filter="url(#pip-shadow)">
    <rect x="5" y="5" width="280" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Top Status Strip -->
  <g transform="translate(18, 16)">
    <!-- Status Green Pulse -->
    <circle cx="6" cy="6" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="10" fill="#86EFAC" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">TEGAK · 12:45</text>
    
    <!-- App Label -->
    <text x="254" y="10" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" text-anchor="end">BUNGKOK PiP</text>
  </g>

  <!-- Live Mini Camera Feed -->
  <g id="pip-cam" transform="translate(18, 38)">
    <rect x="0" y="0" width="254" height="95" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1" />
    
    <!-- Mini Wireframe -->
    <g stroke="#22C55E" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <circle cx="127" cy="28" r="3" fill="#22C55E" stroke="#FFFFFF" stroke-width="1" />
      <line x1="127" y1="28" x2="127" y2="55" />
      <line x1="82" y1="55" x2="172" y2="55" stroke-width="2.5" />
      <circle cx="82" cy="55" r="3.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="172" cy="55" r="3.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1" />
      <line x1="82" y1="55" x2="72" y2="90" />
      <line x1="172" y1="55" x2="182" y2="90" />
    </g>

    <!-- Mini FPS tag -->
    <rect x="8" y="72" width="62" height="16" rx="4" fill="#000000" fill-opacity="0.6" />
    <text x="14" y="83" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="8.5" font-weight="600">30 FPS · 3D</text>
  </g>

  <!-- Bottom Control Bar -->
  <g transform="translate(18, 142)">
    <!-- Pause Button -->
    <rect x="0" y="0" width="122" height="28" rx="8" fill="#334155" />
    <text x="61" y="18" fill="#E2E8F0" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⏸️ Ambil Jeda</text>

    <!-- Finish Button -->
    <rect x="132" y="0" width="122" height="28" rx="8" fill="#FF4D99" />
    <text x="193" y="18" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⏹️ Selesai</text>
  </g>
</svg>
