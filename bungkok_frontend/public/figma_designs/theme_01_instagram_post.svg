<svg width="480" height="600" viewBox="0 0 480 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ig-shadow" x="0" y="0" width="480" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <g filter="url(#ig-shadow)">
    <rect x="15" y="15" width="450" height="570" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- ==================== HEADER (USER PROFILE) ==================== -->
  <g transform="translate(35, 32)">
    <!-- Avatar -->
    <circle cx="20" cy="20" r="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Avatar silhouette -->
    <circle cx="20" cy="15" r="7" fill="#94A3B8" />
    <path d="M9 32C9 26 14 24 20 24C26 24 31 26 31 32" fill="#94A3B8" />

    <!-- User details -->
    <text x="50" y="19" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">bungkok.user</text>
    <text x="50" y="32" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Jakarta, Indonesia · Sesi Latihan</text>

    <!-- More Options Icon (•••) -->
    <circle cx="395" cy="20" r="2.5" fill="#334155" />
    <circle cx="405" cy="20" r="2.5" fill="#334155" />
    <circle cx="415" cy="20" r="2.5" fill="#334155" />
  </g>

  <!-- ==================== CENTER: CAMERA FEED CUTOUT (410 x 320 px) ==================== -->
  <g transform="translate(35, 80)">
    <!-- Webcam container -->
    <rect x="0" y="0" width="410" height="320" rx="14" fill="#0F172A" />
    
    <!-- Camera Skeleton Pose Overlay -->
    <g stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <circle cx="205" cy="100" r="4.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="205" y1="100" x2="205" y2="155" stroke-width="3" />
      <line x1="125" y1="155" x2="285" y2="155" stroke-width="4" />
      <circle cx="125" cy="155" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="285" cy="155" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Arms -->
      <line x1="125" y1="155" x2="105" y2="235" />
      <line x1="285" y1="155" x2="305" y2="235" />
      <line x1="105" y1="235" x2="90" y2="295" />
      <line x1="305" y1="235" x2="320" y2="295" />
    </g>

    <!-- Status Tag in Feed -->
    <rect x="14" y="14" width="140" height="26" rx="13" fill="#15803D" fill-opacity="0.9" />
    <circle cx="26" cy="27" r="3.5" fill="#86EFAC" />
    <text x="36" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Tegak Sempurna</text>
  </g>

  <!-- ==================== FOOTER: ACTION ICONS ==================== -->
  <g transform="translate(35, 416)">
    <!-- Heart Icon (Liked - Red) -->
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ED4956" />

    <!-- Comment Bubble Icon -->
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="#262626" stroke-width="2" fill="none" transform="translate(34, 0)" />

    <!-- Share Paper Plane Icon -->
    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(72, 0)" />

    <!-- Pagination Dots (Center) -->
    <circle cx="205" cy="12" r="3" fill="#3897F0" />
    <circle cx="215" cy="12" r="3" fill="#DBDBDB" />
    <circle cx="225" cy="12" r="3" fill="#DBDBDB" />

    <!-- Bookmark Icon (Right) -->
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(388, 0)" />
  </g>

  <!-- ==================== CAPTION & METRICS ==================== -->
  <g transform="translate(35, 458)">
    <text x="0" y="16" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">1,428 suka · 18m waktu tegak</text>
    
    <text x="0" y="36" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13">
      <tspan font-weight="700">bungkok.user</tspan>
      <tspan font-weight="400"> Tetap tegak dan fokus kerja seharian bareng Bungkok AI! </tspan>
      <tspan fill="#00376B">#Ergonomi #PostureCheck</tspan>
    </text>

    <text x="0" y="58" fill="#8E8E8E" font-family="-apple-system, sans-serif" font-size="12">Lihat semua 94 komentar</text>
    <text x="0" y="74" fill="#C7C7C7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.4">2 JAM YANG LALU</text>
  </g>
</svg>
